<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Trailrider.cat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
#ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10;}
#lc{position:absolute;bottom:16px;left:16px;display:flex;gap:10px;pointer-events:all;}
#rc{position:absolute;bottom:16px;right:16px;display:flex;gap:10px;pointer-events:all;}
.b{width:62px;height:62px;border-radius:12px;background:rgba(20,20,20,0.88);border:2px solid rgba(255,255,255,0.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:rgba(255,255,255,0.78);font-size:22px;-webkit-user-select:none;user-select:none;cursor:pointer;}
.b span{font-size:9px;font-weight:700;letter-spacing:1px;font-family:monospace;color:rgba(255,255,255,0.55);}
.b.on{background:rgba(70,70,70,0.95);}
.bg{border-color:rgba(255,165,30,0.55);}.bg span{color:#ffaa22;}.bg.on{background:rgba(85,45,0,0.95);}
.bf{border-color:rgba(220,55,20,0.48);}.bf span{color:#ff5020;}.bf.on{background:rgba(65,12,0,0.95);}
.hidden{display:none!important;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui" class="hidden">
  <div id="lc">
    <div class="b" id="bl">&#9664;</div>
    <div class="b" id="br">&#9654;</div>
  </div>
  <div id="rc">
    <div class="b bg" id="bg">&#9650;<span>GAS</span></div>
    <div class="b bf" id="bb">&#9660;<span>FRE</span></div>
  </div>
</div>

"use strict";

// ── Canvas 480x270 (16:9 horitzontal) ──────────
var LW = 480, LH = 270;
var CV = document.getElementById("c");
var ctx = CV.getContext("2d");
CV.width = LW;
CV.height = LH;

function resize() {
  var s = Math.min(window.innerWidth / LW, window.innerHeight / LH);
  CV.style.width  = (LW * s) + "px";
  CV.style.height = (LH * s) + "px";
}
resize();
window.addEventListener("resize", resize);

// ── roundRect polyfill (Safari iOS) ────────────
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r);
    this.lineTo(x + w, y + h - r);
    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    this.lineTo(x + r, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r);
    this.lineTo(x, y + r);
    this.quadraticCurveTo(x, y, x + r, y);
    this.closePath();
  };
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function px(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
}

// ── Input ───────────────────────────────────────
var K = {};
document.addEventListener("keydown", function(e) {
  K[e.key] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(e.key) >= 0) {
    e.preventDefault();
  }
});
document.addEventListener("keyup", function(e) { K[e.key] = false; });

function mkB(id, key) {
  var el = document.getElementById(id);
  function on(e)  { e.preventDefault(); K[key] = true;  el.classList.add("on"); }
  function off(e) { e.preventDefault(); K[key] = false; el.classList.remove("on"); }
  el.addEventListener("touchstart",  on,  {passive: false});
  el.addEventListener("touchend",    off, {passive: false});
  el.addEventListener("touchcancel", off, {passive: false});
  el.addEventListener("mousedown",   on);
  el.addEventListener("mouseup",     off);
  el.addEventListener("mouseleave",  off);
}
mkB("bl", "ArrowLeft");
mkB("br", "ArrowRight");
mkB("bg", "ArrowUp");
mkB("bb", "ArrowDown");

var menuState = "start";
var menuSel   = 0;
var menuFrame = 0;

var BTNS = [
  {label: "START",   y: 0.525, act: "start"},
  {label: "OPTIONS", y: 0.625, act: "opts"},
  {label: "EXIT",    y: 0.725, act: "exit"}
];

CV.addEventListener("click", function(e) {
  if (menuState !== "start") return;
  var r = CV.getBoundingClientRect();
  var s = LW / r.width;
  var cy = (e.clientY - r.top) * s;
  for (var i = 0; i < BTNS.length; i++) {
    var by = BTNS[i].y * LH;
    if (cy > by - 14 && cy < by + 16) {
      menuSel = i;
      if (BTNS[i].act === "start") startGame();
    }
  }
});
CV.addEventListener("touchend", function(e) {
  e.preventDefault();
  if (menuState !== "start") return;
  var r = CV.getBoundingClientRect();
  var s = LW / r.width;
  var t = e.changedTouches[0];
  var cy = (t.clientY - r.top) * s;
  for (var i = 0; i < BTNS.length; i++) {
    var by = BTNS[i].y * LH;
    if (cy > by - 14 && cy < by + 16) {
      menuSel = i;
      if (BTNS[i].act === "start") startGame();
    }
  }
}, {passive: false});
document.addEventListener("keydown", function(e) {
  if (menuState !== "start") return;
  if (e.key === "ArrowDown") menuSel = (menuSel + 1) % BTNS.length;
  if (e.key === "ArrowUp")   menuSel = (menuSel - 1 + BTNS.length) % BTNS.length;
  if (e.key === " " || e.key === "Enter") {
    if (BTNS[menuSel].act === "start") startGame();
  }
});

function startGame() {
  menuState = "game";
  document.getElementById("ui").classList.remove("hidden");
  G = newGame();
}

function drawMenu() {
  menuFrame++;
  if (portImg.complete && portImg.naturalWidth > 0) {
    ctx.drawImage(portImg, 0, 0, LW, LH);
    ctx.fillStyle = "rgba(0,0,0,0.20)";
    ctx.fillRect(0, 0, LW, LH);
  } else {
    px(0, 0, LW, LH, "#1a0e08");
  }
  // Botons
  var bw = 160, bh = 18, bx = LW / 2 - bw / 2;
  for (var i = 0; i < BTNS.length; i++) {
    var by = BTNS[i].y * LH - bh / 2;
    var isSel   = (i === menuSel);
    var isStart = (BTNS[i].act === "start");
    // Ombra
    ctx.fillStyle = "rgba(0,0,0,0.60)";
    rr(bx + 2, by + 2, bw, bh, 5);
    ctx.fill();
    // Fons
    ctx.fillStyle = isStart ? (isSel ? "#e86010" : "#c85008") : (isSel ? "rgba(60,40,20,0.90)" : "rgba(10,8,6,0.82)");
    rr(bx, by, bw, bh, 5);
    ctx.fill();
    // Vora
    ctx.strokeStyle = isStart ? (isSel ? "#ff9040" : "#ff7020") : (isSel ? "#886644" : "#443322");
    ctx.lineWidth = 1.5;
    rr(bx, by, bw, bh, 5);
    ctx.stroke();
    // Highlight
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    rr(bx + 2, by + 1, bw - 4, bh * 0.4, 3);
    ctx.fill();
    // Text
    ctx.font = "bold " + (isStart ? 9 : 8) + "px monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillText(BTNS[i].label, LW / 2 + 1, by + bh * 0.68 + 1);
    ctx.fillStyle = isStart ? "#fff" : (isSel ? "#ddd" : "#aaa");
    ctx.fillText(BTNS[i].label, LW / 2, by + bh * 0.68);
  }
  // Parpelleig
  if (Math.floor(menuFrame / 35) % 2 === 0) {
    ctx.font = "5px monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,220,160,0.70)";
    ctx.fillText("TAP START o prem ESPAI", LW / 2, LH - 8);
  }
}

var PX = 3;
var SDW = SPR_COLS * PX;
var SDH = SPR_ROWS * PX;

function buildSprCanvas() {
  var oc = document.createElement("canvas");
  oc.width  = SDW;
  oc.height = SDH;
  var c2 = oc.getContext("2d");
  for (var sy = 0; sy < SPR.length; sy++) {
    var row = SPR[sy];
    for (var sx = 0; sx < row.length; sx++) {
      var col = row[sx];
      if (!col || col === 0) continue;
      c2.fillStyle = col;
      c2.fillRect(sx * PX, sy * PX, PX, PX);
    }
  }
  return oc;
}
var sprOC = buildSprCanvas();
var WT = [0,1,2,3,4,5,6,7];
var WB = [46,47,48,49,50,51,52,53];

function drawMoto(dx, dy, lean, wf) {
  ctx.save();
  ctx.translate((dx + SDW / 2) | 0, (dy + SDH) | 0);
  if (lean !== 0) ctx.transform(1, 0, lean * 0.055, 1, 0, 0);
  ctx.translate((-SDW / 2) | 0, -SDH | 0);
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath();
  ctx.ellipse(SDW / 2, SDH + 2, SDW * 0.42, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.drawImage(sprOC, 0, 0);
  var off = (wf % PX + PX) % PX;
  if (off > 0) {
    var wrows = WT.concat(WB);
    for (var wi = 0; wi < wrows.length; wi++) {
      var sy2 = wrows[wi];
      var row2 = SPR[sy2];
      if (!row2) continue;
      for (var sx2 = 0; sx2 < row2.length; sx2++) {
        var col2 = row2[sx2];
        if (!col2 || col2 === 0) continue;
        ctx.fillStyle = col2;
        ctx.fillRect((sx2 * PX + off) % (SPR_COLS * PX), sy2 * PX, PX, PX);
      }
    }
  }
  ctx.restore();
}

function drawPedraforca(){
  const BASE = HOR;       // línia base = horitzó
  const CX   = LW * 0.52; // centre lleugerament a la dreta
  const SC   = 1.0;        // escala

  // ── Capa de fons: Serra del Cadí (silhouette blava fosca) ──
  ctx.fillStyle='#1e2e40';
  ctx.beginPath();
  ctx.moveTo(0, BASE);
  // Serra llarga i suau
  const cadi=[
    [0,18],[30,8],[55,22],[80,4],[105,16],[130,6],[155,18],[180,8],
    [205,20],[230,5],[255,15],[280,7],[310,18],[335,8],[360,20],[360,BASE]
  ];
  cadi.forEach(([x,y])=>ctx.lineTo(x, BASE-y));
  ctx.lineTo(360,BASE);ctx.closePath();ctx.fill();

  // ── Capa 2: Serres intermèdies (verd fosc) ──
  ctx.fillStyle='#1a3018';
  ctx.beginPath();
  ctx.moveTo(0,BASE);
  const serres=[
    [0,28],[15,14],[30,24],[48,10],[65,20],[82,6],[100,18],[118,8],
    [136,22],[154,10],[172,26],[190,12],[208,28],[226,14],[244,24],
    [262,8],[280,20],[298,10],[316,24],[334,12],[360,26],[360,BASE]
  ];
  serres.forEach(([x,y])=>ctx.lineTo(x,BASE-y));
  ctx.lineTo(360,BASE);ctx.closePath();ctx.fill();

  // ── PEDRAFORCA principal ──
  // Mesures reals (proporcionades):
  // Pollegó Superior (esquerra): el pic més alt
  // Pollegó Inferior (dreta): una mica més baix
  // L'Espatlla: la connexió horitzontal entre els dos
  // La Forquilla: la vall característica (osca profunda al mig inferior)

  const PF_CX  = CX;
  const PF_SCY = SC * 1.12; // escala vertical

  // Punts del Pedraforca (coordenades relatives al CX, BASE)
  // Mesures aproximades a escala de pantalla
  const h = (v) => BASE - v * PF_SCY; // altura en px

  // Roca calcària: color base
  ctx.fillStyle='#8a9a8c';
  // Sombra (cara est, més fosca)
  ctx.fillStyle='#5a6858';

  // Forma completa del Pedraforca
  // Explicació punt a punt:
  // El pic esquerre (Pollegó Superior) és el més alt
  // Hi ha l'espatlla que connecta a una alçada intermèdia
  // Després puja el segon pic (Pollegó Inferior, una mica menys alt)
  // Al centre, la "forquilla" baixa molt (vall profunda en V)
  // La base s'eixampla en falda

  const pf_pts = [
    // Falda esquerra base
    [PF_CX - 95, BASE],
    [PF_CX - 88, h(12)],
    [PF_CX - 78, h(24)],
    [PF_CX - 68, h(38)],
    [PF_CX - 55, h(50)],
    [PF_CX - 48, h(62)],
    // Cara nord-est Pollegó Superior (pujada esquerrana)
    [PF_CX - 40, h(74)],
    [PF_CX - 32, h(86)],
    [PF_CX - 24, h(96)],
    [PF_CX - 18, h(104)],
    // CIM Pollegó Superior ← el pic mes alt
    [PF_CX - 10, h(112)],
    [PF_CX -  4, h(116)],
    [PF_CX +  0, h(114)],  // lleuger doble cim
    [PF_CX +  4, h(118)],  // CIM MÀXIM
    [PF_CX +  8, h(116)],
    [PF_CX + 12, h(112)],
    // Baixada cap a l'Espatlla
    [PF_CX + 18, h(96)],
    [PF_CX + 24, h(84)],
    // L'ESPATLLA (plataforma horitzontal característica)
    [PF_CX + 30, h(78)],
    [PF_CX + 36, h(76)],
    [PF_CX + 42, h(75)],
    [PF_CX + 46, h(76)],
    // Pujada Pollegó Inferior
    [PF_CX + 50, h(82)],
    [PF_CX + 54, h(90)],
    [PF_CX + 58, h(100)],
    // CIM Pollegó Inferior (una mica menys alt)
    [PF_CX + 62, h(106)],
    [PF_CX + 65, h(109)],
    [PF_CX + 68, h(110)],  // CIM
    [PF_CX + 71, h(109)],
    [PF_CX + 74, h(106)],
    // Baixada est
    [PF_CX + 80, h(90)],
    [PF_CX + 86, h(72)],
    [PF_CX + 90, h(56)],
    // LA FORQUILLA (el forat en V cap avall entre els dos pics)
    // Això és el tret més característic del Pedraforca
    [PF_CX + 94, h(40)],
    [PF_CX + 98, h(26)],
    // A la dreta de la forquilla (la falda dreta)
    [PF_CX +102, h(18)],
    [PF_CX +108, h(8)],
    [PF_CX +115, BASE],
  ];

  // Dibuixa la forma base (roca)
  ctx.fillStyle='#6a7a6c';
  ctx.beginPath();
  ctx.moveTo(pf_pts[0][0], pf_pts[0][1]);
  pf_pts.forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.closePath();ctx.fill();

  // Cara il·luminada (oest, sol de tarda)
  ctx.fillStyle='#8a9a8e';
  ctx.beginPath();
  ctx.moveTo(PF_CX-95, BASE);
  pf_pts.slice(0,17).forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.lineTo(PF_CX+12,h(80));
  ctx.lineTo(PF_CX-30,h(50));
  ctx.lineTo(PF_CX-60,h(25));
  ctx.lineTo(PF_CX-95,BASE);
  ctx.closePath();ctx.fill();

  // Cara en sombra (est)
  ctx.fillStyle='#3a4a3c';
  ctx.beginPath();
  ctx.moveTo(PF_CX+4,h(118));
  pf_pts.slice(14,34).forEach(([x,y])=>ctx.lineTo(x,y));
  ctx.lineTo(PF_CX+50,h(60));
  ctx.lineTo(PF_CX+20,h(75));
  ctx.lineTo(PF_CX+10,h(100));
  ctx.closePath();ctx.fill();

  // L'ESPATLLA (zona plana, color diferent per destacar-la)
  ctx.fillStyle='#7a8a7c';
  ctx.beginPath();
  ctx.moveTo(PF_CX+18,h(96));
  ctx.lineTo(PF_CX+24,h(84));
  ctx.lineTo(PF_CX+46,h(76));
  ctx.lineTo(PF_CX+50,h(82));
  ctx.lineTo(PF_CX+42,h(90));
  ctx.lineTo(PF_CX+28,h(94));
  ctx.closePath();ctx.fill();

  // ── NEU ──────────────────────────────────────
  // Capa base neu (coberta general dels cims)
  ctx.fillStyle='rgba(235,240,245,0.92)';

  // Neu Pollegó Superior
  ctx.beginPath();
  ctx.moveTo(PF_CX-18,h(104));
  ctx.lineTo(PF_CX-10,h(112));
  ctx.lineTo(PF_CX-4,h(116));
  ctx.lineTo(PF_CX+4,h(118));
  ctx.lineTo(PF_CX+8,h(116));
  ctx.lineTo(PF_CX+12,h(112));
  ctx.lineTo(PF_CX+18,h(96));
  ctx.lineTo(PF_CX+10,h(90));
  ctx.lineTo(PF_CX+2,h(92));
  ctx.lineTo(PF_CX-8,h(88));
  ctx.lineTo(PF_CX-14,h(94));
  ctx.closePath();ctx.fill();

  // Neu Pollegó Inferior
  ctx.beginPath();
  ctx.moveTo(PF_CX+58,h(100));
  ctx.lineTo(PF_CX+62,h(106));
  ctx.lineTo(PF_CX+65,h(109));
  ctx.lineTo(PF_CX+68,h(110));
  ctx.lineTo(PF_CX+71,h(109));
  ctx.lineTo(PF_CX+74,h(106));
  ctx.lineTo(PF_CX+80,h(90));
  ctx.lineTo(PF_CX+72,h(86));
  ctx.lineTo(PF_CX+64,h(88));
  ctx.lineTo(PF_CX+58,h(94));
  ctx.closePath();ctx.fill();

  // Neu a l'Espatlla
  ctx.fillStyle='rgba(225,232,238,0.75)';
  ctx.beginPath();
  ctx.moveTo(PF_CX+24,h(84));
  ctx.lineTo(PF_CX+30,h(78));
  ctx.lineTo(PF_CX+42,h(75));
  ctx.lineTo(PF_CX+46,h(76));
  ctx.lineTo(PF_CX+44,h(80));
  ctx.lineTo(PF_CX+32,h(82));
  ctx.lineTo(PF_CX+26,h(86));
  ctx.closePath();ctx.fill();

  // Regalims de neu (línies blanques verticals pels canalons)
  ctx.strokeStyle='rgba(220,228,236,0.55)';
  ctx.lineWidth=1;
  [
    [[PF_CX-22,h(100)],[PF_CX-30,h(72)],[PF_CX-40,h(55)]],
    [[PF_CX-8,h(108)],[PF_CX-12,h(82)],[PF_CX-18,h(62)]],
    [[PF_CX+14,h(110)],[PF_CX+16,h(88)],[PF_CX+20,h(70)]],
    [[PF_CX+72,h(106)],[PF_CX+76,h(80)],[PF_CX+80,h(60)]],
  ].forEach(seg=>{
    ctx.beginPath();
    ctx.moveTo(seg[0][0],seg[0][1]);
    seg.slice(1).forEach(([x,y])=>ctx.lineTo(x,y));
    ctx.stroke();
  });

  // Brillantor neu (reflexos puntuals)
  ctx.fillStyle='rgba(255,255,255,0.90)';
  [[PF_CX+4,h(118)],[PF_CX+68,h(110)],[PF_CX+36,h(76)]].forEach(([x,y])=>{
    ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
  });

  // ── Capes de vegetació basal ──────────────────
  // Bosc al peu del Pedraforca
  ctx.fillStyle='#1e3a18';
  ctx.beginPath();
  ctx.moveTo(PF_CX-95,BASE);
  ctx.lineTo(PF_CX-80,h(18));
  ctx.lineTo(PF_CX-65,h(28));
  ctx.lineTo(PF_CX-50,h(16));
  ctx.lineTo(PF_CX-35,h(24));
  ctx.lineTo(PF_CX-20,h(14));
  // Forquilla baixa: deixa el forat visible
  ctx.lineTo(PF_CX+85,h(14));
  ctx.lineTo(PF_CX+95,h(22));
  ctx.lineTo(PF_CX+108,h(10));
  ctx.lineTo(PF_CX+115,BASE);
  ctx.closePath();ctx.fill();

  // Detall roques al peu (pixel art)
  ctx.fillStyle='#4a5a4c';
  [[PF_CX-60,h(14)],[PF_CX-30,h(10)],[PF_CX+85,h(10)],[PF_CX+100,h(16)]].forEach(([rx,ry])=>{
    ctx.beginPath();ctx.ellipse(rx,ry,8,4,0.1,0,Math.PI*2);ctx.fill();
  });
}

function drawSky() {
  var rh = HOR / SKY_COLS.length;
  for (var i = 0; i < SKY_COLS.length; i++) {
    px(0, i * rh | 0, LW, (rh + 1) | 0, SKY_COLS[i]);
  }
  px(0, HOR - 3, LW, 3, "rgba(180,200,160,0.22)");
  for (var ci = 0; ci < CLOUDS.length; ci++) {
    var cl = CLOUDS[ci];
    cl.x = (cl.x + 0.06) % (LW + 16);
    for (var cj = 0; cj < cl.s.length; cj++) {
      px(cl.x + cl.s[cj][0] * 2, cl.y + cl.s[cj][1] * 2, 2, 2, "rgba(255,255,255,0.72)");
    }
  }
  drawPedraforca();
}

var TRACK  = ["#7a4010","#6a3808","#824818","#704010"];
var PEBBLE = ["#c8a878","#b89868","#d4b888","#e0c898","#9a7848"];
var PEBBLES = [];
for (var pi = 0; pi < 80; pi++) {
  PEBBLES.push({rpos: (pi*79+pi*pi*13)%180, ryoff: (pi*41+23)%60, sz: 1+(pi%4===0?1:0), ci: pi%5});
}
var scrollY = 0;

function roadHW(z) { return 12 + z * 105; }

function drawTerrain() {
  var cx = LW / 2;
  for (var y = HOR; y < LH; y++) {
    var z  = (y - HOR) / (LH - HOR);
    var hw = roadHW(z);
    var x0 = (cx - hw) | 0;
    var x1 = (cx + hw) | 0;
    var sy = (scrollY + y) | 0;
    var di = ((sy) % 6 + 6) % 6;
    if (x0 > 0)  px(0,  y, x0,      1, DIRT[di]);
    if (x1 < LW) px(x1, y, LW - x1, 1, DIRT[di]);
    var ew = Math.max(1, (z * 2.5) | 0);
    px(x0 - ew, y, ew, 1, "#7a3e0e");
    px(x1,      y, ew, 1, "#7a3e0e");
    var ti = ((sy) % 4 + 4) % 4;
    px(x0, y, x1 - x0, 1, TRACK[ti]);
    var t1 = (cx - hw * 0.30) | 0;
    var t2 = (cx + hw * 0.30) | 0;
    var tw = Math.max(1, (z * 2.2) | 0);
    px(t1, y, tw, 1, "#5a2c08");
    px(t2, y, tw, 1, "#5a2c08");
    if (z > 0.10) {
      for (var pbi = 0; pbi < PEBBLES.length; pbi++) {
        var pb = PEBBLES[pbi];
        var pvy = ((pb.ryoff + (scrollY | 0) * 1.1) % (LH - HOR)) | 0;
        if (pvy !== (y - HOR)) continue;
        var rw = x1 - x0;
        if (rw < 2) continue;
        px(x0 + (pb.rpos % rw) | 0, y, pb.sz, pb.sz, PEBBLE[pb.ci]);
      }
    }
  }
  scrollY += G.spd * 1.4;
}

// ── Vegetació lateral ──────────────────────────
function mkPine(h) {
  var w = (h * 0.68) | 0;
  var oc = document.createElement("canvas");
  oc.width = w; oc.height = h + 4;
  var c = oc.getContext("2d");
  var layers = [
    [0.92,0.34,0,"#1e3a10","#2e5218","#3a6028"],
    [0.74,0.30,0.22,"#243e14","#345820","#406630"],
    [0.56,0.28,0.42,"#182e0e","#283e16","#303e20"]
  ];
  for (var li = 0; li < layers.length; li++) {
    var l = layers[li];
    var lw = (w * l[0]) | 0, lh = (h * l[1]) | 0, ly = (h * 0.76 - h * l[2]) | 0;
    c.fillStyle = l[3];
    c.beginPath(); c.moveTo(w/2, ly-lh); c.lineTo(w/2-lw/2, ly); c.lineTo(w/2+lw/2, ly); c.closePath(); c.fill();
    c.fillStyle = l[4];
    c.beginPath(); c.moveTo(w/2, ly-lh+1); c.lineTo(w/2-lw/2+2, ly-1); c.lineTo(w/2+lw/2-2, ly-1); c.closePath(); c.fill();
    c.fillStyle = l[5];
    c.beginPath(); c.moveTo(w/2-lw*0.1, ly-lh+1); c.lineTo(w/2-lw*0.4, ly-lh*0.3); c.lineTo(w/2+lw*0.05, ly-lh*0.35); c.closePath(); c.fill();
  }
  c.fillStyle = "#5a3010";
  c.fillRect((w/2-2)|0, (h*0.76)|0, 4, (h*0.24+4)|0);
  return oc;
}
function mkBush(s) {
  var oc = document.createElement("canvas");
  oc.width = s; oc.height = s;
  var c = oc.getContext("2d");
  var cols = ["#2a4818","#3a5820","#4a6828","#2e4e18","#1e3a10","#506030"];
  for (var y = 0; y < s; y++) {
    for (var x = 0; x < s; x++) {
      var dx = x - s/2, dy = y - s/2;
      if (Math.sqrt(dx*dx+dy*dy) < s*0.45 + Math.sin(x*0.8+y*1.2)*s*0.06) {
        c.fillStyle = cols[(x*3+y*7)%cols.length];
        c.fillRect(x, y, 1, 1);
      }
    }
  }
  return oc;
}
var PINE_A = mkPine(44), PINE_B = mkPine(28);
var BUSH_A = mkBush(22), BUSH_B = mkBush(14);
var SIDES = [];
for (var si = 0; si < 64; si++) {
  SIDES.push({z: Math.random(), side: si%2?1:-1, type: Math.random()<0.52?"pine":"bush", off: 6+Math.random()*20, big: Math.random()<0.5});
}
function drawVeg() {
  var cx = LW / 2;
  var sorted = SIDES.slice().sort(function(a,b){return a.z-b.z;});
  for (var si2 = 0; si2 < sorted.length; si2++) {
    var s = sorted[si2];
    var sy3 = HOR + s.z * (LH - HOR);
    var hw2 = roadHW(s.z);
    var bx  = cx + s.side * (hw2 + s.off * (s.z*0.85+0.2)*2 + 3);
    if (s.z < 0.07) continue;
    var spr = s.type === "pine" ? (s.big ? PINE_A : PINE_B) : (s.big ? BUSH_A : BUSH_B);
    var sw = (spr.width  * s.z * 2.5) | 0;
    var sh = (spr.height * s.z * 2.5) | 0;
    if (sw < 3) continue;
    ctx.drawImage(spr, (bx-sw/2)|0, (sy3-(s.type==="pine"?sh:sh*0.55))|0, sw, sh);
    s.z += G.spd * 0.0028;
    if (s.z > 1.04) { s.z = 0.01+Math.random()*0.05; s.off = 6+Math.random()*20; s.type = Math.random()<0.52?"pine":"bush"; s.big = Math.random()<0.5; }
  }
}

// ── Obstacles ───────────────────────────────────
function mkGrass() {
  var oc = document.createElement("canvas");
  oc.width = 22; oc.height = 18;
  var c = oc.getContext("2d");
  var gc = ["#4a7820","#3a6018","#5a8828","#2e5010","#6a9030"];
  for (var gi = 0; gi < 9; gi++) {
    var gx = 2 + gi * 2;
    var gh = 6 + Math.sin(gi * 1.4) * 5;
    c.strokeStyle = gc[gi % gc.length];
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(gx, 18);
    c.quadraticCurveTo(gx + (gi%3-1)*3, 18-gh*0.5, gx+(gi%2===0?1:-1)*2, 18-gh);
    c.stroke();
  }
  return oc;
}
function mkRBush(s) {
  var oc = document.createElement("canvas");
  oc.width = s; oc.height = (s*0.72)|0;
  var c = oc.getContext("2d");
  var cols = ["#4a7020","#3a5818","#5a8028","#2a4810","#608030","#486820"];
  var h = oc.height;
  for (var y = 0; y < h; y++) {
    for (var x = 0; x < s; x++) {
      var dx = x-s/2, dy = y-h*0.45;
      if (Math.sqrt(dx*dx+(dy*1.35)*(dy*1.35)) < s*0.44 + Math.sin(x*1.1+y*0.9)*s*0.09) {
        c.fillStyle = cols[(x*2+y*5)%cols.length];
        c.fillRect(x, y, 1, 1);
      }
    }
  }
  return oc;
}
var GRASS_SPR  = mkGrass();
var RBUSH_S = mkRBush(20), RBUSH_M = mkRBush(30), RBUSH_L = mkRBush(42);

var obstacles = [];
var obsTimer  = 0;
var splashes  = [];

function addSplash(x, y, spd) {
  var s2 = spd || 2;
  for (var i = 0; i < 28; i++) {
    var a = Math.random() * Math.PI * 2;
    var v = 2.5 + Math.random() * (3.5 + s2 * 1.5);
    splashes.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-(2+Math.random()*2), life:1, sz:3+Math.random()*5, type:"water"});
  }
  for (var j = 0; j < 7; j++) {
    splashes.push({x:x+(Math.random()-0.5)*16, y:y, vx:(Math.random()-0.5)*1.5, vy:-(3+Math.random()*4.5), life:1, sz:4+Math.random()*5, type:"drop"});
  }
}
function updateSplashes() {
  var alive = [];
  for (var i = 0; i < splashes.length; i++) {
    var s = splashes[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.20;
    s.life -= s.type === "drop" ? 0.032 : 0.042;
    s.sz = Math.max(0.5, s.sz - 0.05);
    if (s.life > 0) alive.push(s);
  }
  splashes = alive;
}
function drawSplashes() {
  for (var i = 0; i < splashes.length; i++) {
    var s = splashes[i];
    var a = Math.min(1, s.life * 1.2);
    if (s.type === "drop") {
      ctx.fillStyle = "rgba(130,180,220," + (a*0.92) + ")";
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(Math.atan2(s.vy, s.vx) + Math.PI/2);
      ctx.beginPath(); ctx.ellipse(0, 0, s.sz*0.38, s.sz*0.85, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = "rgba(100,155,195," + (a*0.78) + ")";
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.sz, s.sz*0.45, 0, 0, Math.PI*2); ctx.fill();
    }
  }
}

function spawnObs() {
  var types = ["hole","puddle","puddle","grass","grass","bush","bush","bush"];
  var t  = types[Math.floor(Math.random() * types.length)];
  var los = [-0.62,-0.22,0.22,0.62];
  var lo = los[Math.floor(Math.random() * 4)];
  obstacles.push({
    type: t, lo: lo, z: 0.04,
    spd:  0.006 + Math.random()*0.003,
    hit:  false,
    w: t==="hole" ? 0.12+Math.random()*0.08 : t==="puddle" ? 0.22+Math.random()*0.12 : 0.10+Math.random()*0.06,
    h: t==="hole" ? 0.07+Math.random()*0.04 : t==="puddle" ? 0.065+Math.random()*0.04 : 0.08,
    bv: Math.floor(Math.random() * 3)
  });
}

function drawOneObs(o) {
  var cx = LW / 2;
  var z  = o.z;
  var hw = roadHW(z);
  var ox = cx + o.lo * hw;
  var oy = HOR + z * (LH - HOR);
  var ow = o.w * hw * 2;
  var oh = Math.max(3, o.h * hw * 0.65);

  if (o.type === "hole") {
    ctx.fillStyle = "rgba(0,0,0,0.50)";
    ctx.beginPath(); ctx.ellipse(ox+2, oy+2, ow*0.54, oh*0.66, 0, 0, Math.PI*2); ctx.fill();
    var hg = ctx.createRadialGradient(ox, oy-oh*0.15, 0, ox, oy, ow*0.52);
    hg.addColorStop(0, "#050200"); hg.addColorStop(0.55, "#180c04"); hg.addColorStop(1, "rgba(35,15,5,0)");
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.ellipse(ox, oy, ow*0.52, oh*0.62, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#9a6020"; ctx.lineWidth = Math.max(1, z*3);
    ctx.beginPath(); ctx.ellipse(ox, oy, ow*0.52, oh*0.62, 0, 0, Math.PI*2); ctx.stroke();

  } else if (o.type === "puddle") {
    var pr = ow*0.56, ph = oh*0.62;
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath(); ctx.ellipse(ox+2, oy+3, pr*1.04, ph*0.78, 0, 0, Math.PI*2); ctx.fill();
    var pg = ctx.createRadialGradient(ox-pr*0.18, oy-ph*0.12, 0, ox, oy, pr);
    pg.addColorStop(0, "#88aabf"); pg.addColorStop(0.30, "#6a8fa8");
    pg.addColorStop(0.65, "#4a7090"); pg.addColorStop(1, "rgba(30,55,70,0)");
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(ox, oy, pr, ph, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(200,225,242,0.62)";
    ctx.beginPath(); ctx.ellipse(ox-pr*0.20, oy-ph*0.22, pr*0.22, ph*0.14, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(230,242,252,0.45)";
    ctx.beginPath(); ctx.ellipse(ox+pr*0.08, oy-ph*0.10, pr*0.12, ph*0.08, 0.2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba(80,120,150,0.40)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(ox, oy, pr*0.55, ph*0.55, 0, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(ox, oy, pr*0.82, ph*0.82, 0, 0, Math.PI*2); ctx.stroke();

  } else if (o.type === "grass") {
    var sc = z * 2.4;
    var gw = (GRASS_SPR.width  * sc) | 0;
    var ghh = (GRASS_SPR.height * sc) | 0;
    if (gw < 3) return;
    ctx.drawImage(GRASS_SPR, (ox-gw/2)|0, (oy-ghh)|0, gw, ghh);

  } else if (o.type === "bush") {
    var bsprs = [RBUSH_S, RBUSH_M, RBUSH_L];
    var bspr = bsprs[Math.min(2, o.bv)];
    var bsc = z * 2.6;
    var bw2 = (bspr.width  * bsc) | 0;
    var bh2 = (bspr.height * bsc) | 0;
    if (bw2 < 3) return;
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath(); ctx.ellipse(ox, oy, bw2*0.44, bh2*0.18, 0, 0, Math.PI*2); ctx.fill();
    ctx.drawImage(bspr, (ox-bw2/2)|0, (oy-bh2)|0, bw2, bh2);
  }
}

function updateObstacles() {
  obsTimer++;
  if (obsTimer > Math.max(30, 110 - G.spd * 14)) { obsTimer = 0; spawnObs(); }
  var alive2 = [];
  for (var i = 0; i < obstacles.length; i++) {
    var o = obstacles[i];
    o.z = Math.min(1.06, o.z + o.spd * G.spd * 0.10);
    if (o.z < 1.06) alive2.push(o);
  }
  obstacles = alive2;
  var cx2 = LW/2, mx = G.mx, my = LH - SDH*0.5 - 4;
  for (var j = 0; j < obstacles.length; j++) {
    var ob = obstacles[j];
    if (ob.hit || ob.z < 0.72) continue;
    var hw3 = roadHW(ob.z);
    var ox2 = cx2 + ob.lo * hw3;
    var oy2 = HOR  + ob.z * (LH - HOR);
    var ow2 = ob.w * hw3 * 2 * (ob.type==="puddle"?0.52:0.44);
    var oh2 = Math.max(3, ob.h * hw3 * 0.65) * 0.50;
    if (Math.abs(mx-ox2) < ow2+SDW*0.26 && Math.abs(my-oy2) < oh2+SDH*0.16) {
      ob.hit = true;
      if (ob.type === "puddle") {
        addSplash(mx, my - SDH*0.1, G.spd);
        G.spd = Math.max(0.5, G.spd * 0.68);
      } else if (ob.type === "hole") {
        G.hp = Math.max(0, G.hp - 1);
        G.spd = Math.max(0, G.spd - 1.2);
        G.shake = 10; G.crashed = true; G.ct = 28;
        if (G.hp <= 0) G.over = true;
      } else {
        G.spd = Math.max(0.3, G.spd * 0.82);
        G.shake = 3;
      }
    }
  }
  updateSplashes();
}

// ── HUD ─────────────────────────────────────────
function drawHUD() {
  px(0, 0, LW, 11, "rgba(0,0,0,0.62)");
  for (var i = 0; i < 3; i++) {
    var hc = i < G.hp ? "#ff2020" : "#300808";
    var hx = 4 + i * 12;
    var hpts = [[1,0],[2,0],[0,1],[1,1],[2,1],[3,1],[0,2],[1,2],[2,2],[3,2],[1,3],[2,3]];
    for (var hi = 0; hi < hpts.length; hi++) {
      px(hx + hpts[hi][0], 1 + hpts[hi][1], 1, 1, hc);
    }
  }
  ctx.fillStyle = "#ffdd44"; ctx.font = "bold 6px monospace"; ctx.textAlign = "left";
  ctx.fillText("KM " + (G.dist/80).toFixed(1), 42, 9);
  ctx.fillStyle = "#fff";
  ctx.fillText(Math.round(G.spd*14) + "km/h", 108, 9);
  ctx.textAlign = "right"; ctx.fillStyle = "#88ddff";
  ctx.fillText(G.score + "pts", LW - 3, 9);
  px(LW-7, 14, 5, 42, "#181818");
  var r = Math.min(1, G.spd / G.maxSpd);
  var bc = r > 0.82 ? "#ff4400" : r > 0.55 ? "#ffaa00" : "#44dd44";
  px(LW-7, (14 + 42*(1-r))|0, 5, (42*r)|0, bc);
  var w0 = null;
  for (var wi = 0; wi < obstacles.length; wi++) {
    var ob2 = obstacles[wi];
    if (!ob2.hit && ob2.z > 0.52 && ob2.z < 0.78) { w0 = ob2; break; }
  }
  if (w0) {
    var wc = w0.type==="hole"?"#ff4400":w0.type==="puddle"?"#44aaff":"#44cc44";
    var wt = w0.type==="hole"?"! FORAT":w0.type==="puddle"?"~ TOLL":"* MATOLL";
    ctx.fillStyle = wc; ctx.font = "bold 6px monospace"; ctx.textAlign = "center";
    ctx.fillText(wt, LW/2, 9);
  }
}

function drawOver() {
  px(0, 0, LW, LH, "rgba(0,0,0,0.78)");
  ctx.textAlign = "center";
  ctx.fillStyle = "#ff3300"; ctx.font = "bold 10px monospace";
  ctx.fillText("GAME OVER", LW/2, LH*0.38);
  ctx.fillStyle = "#fff"; ctx.font = "7px monospace";
  ctx.fillText(G.score + "pts  " + (G.dist/80).toFixed(1) + "km", LW/2, LH*0.52);
  ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.font = "6px monospace";
  ctx.fillText("refresca per tornar", LW/2, LH*0.65);
}

// ── Estat ────────────────────────────────────────
var G = {on:false, over:false, score:0, dist:0, hp:3, spd:0, maxSpd:3.5,
         mx:LW/2, tx:LW/2, lean:0, frame:0, shake:0, crashed:false, ct:0};

function newGame() {
  obstacles = []; splashes = []; scrollY = 0; obsTimer = 0;
  return {on:true, over:false, score:0, dist:0, hp:3, spd:0, maxSpd:3.5,
          mx:LW/2, tx:LW/2, lean:0, frame:0, shake:0, crashed:false, ct:0};
}

function update() {
  if (menuState !== "game" || !G.on || G.over) return;
  G.frame++;
  if (G.crashed) { G.ct--; if (G.ct <= 0) G.crashed = false; return; }
  if (K["ArrowUp"]   || K[" "]) G.spd = Math.min(G.maxSpd, G.spd + 0.07);
  else                           G.spd = Math.max(0, G.spd - 0.025);
  if (K["ArrowDown"])            G.spd = Math.max(0, G.spd - 0.12);
  var lim = roadHW(1) * 0.82 - SDW * 0.55;
  if (K["ArrowLeft"])  { G.tx = Math.max(LW/2-lim, G.tx-G.spd*1.5); G.lean = Math.max(-1, G.lean-0.16); }
  else if (K["ArrowRight"]) { G.tx = Math.min(LW/2+lim, G.tx+G.spd*1.5); G.lean = Math.min(1, G.lean+0.16); }
  else G.lean *= 0.82;
  G.mx   += (G.tx - G.mx) * 0.16;
  G.dist += G.spd;
  G.score += (G.spd * 0.2) | 0;
  G.shake = Math.max(0, G.shake - 0.5);
  updateObstacles();
}

function render() {
  if (menuState === "start") { drawMenu(); return; }
  ctx.clearRect(0, 0, LW, LH);
  drawSky();
  drawTerrain();
  obstacles.sort(function(a,b){return a.z-b.z;});
  for (var i = 0; i < obstacles.length; i++) drawOneObs(obstacles[i]);
  drawSplashes();
  drawVeg();
  var sx = G.crashed ? Math.sin(G.frame * 0.6) * G.shake : 0;
  drawMoto((G.mx - SDW/2 + sx)|0, (LH - SDH - 4)|0, G.lean, (G.frame/2)|0);
  if (G.crashed && G.ct > 10) {
    ctx.fillStyle = "rgba(255,30,0," + (0.38*G.ct/28) + ")";
    ctx.fillRect(0, 0, LW, LH);
  }
  drawHUD();
  if (G.over) drawOver();
}

(function loop() { update(); render(); requestAnimationFrame(loop); })();
</script>
