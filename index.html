function mkB(id,key){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();K[key]=true;el.classList.add('on');};
  const off=e=>{e.preventDefault();K[key]=false;el.classList.remove('on');};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('touchcancel',off,{passive:false});
  el.addEventListener('mousedown',on);
  el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
}

const PX=3; // escala sprite: cada píxel del sprite = 4px lògics
const SDW=SPR_COLS*PX, SDH=SPR_ROWS*PX;

// Pre-render sprite en offscreen canvas (compatible Safari)
function buildSprCanvas(){
  const oc=document.createElement('canvas');
  oc.width=SDW; oc.height=SDH;
  const c2=oc.getContext('2d');
  SPR.forEach((row,sy)=>{
    row.forEach((col,sx)=>{
      if(!col||col===0)return;
      c2.fillStyle=col;
      c2.fillRect(sx*PX,sy*PX,PX,PX);
    });
  });
  return oc;
}
const sprOC=buildSprCanvas();

// Detecta files de roda (files amb píxels de pneumàtic negre/gris)
// Roda davantera: primeres files, roda darrere: últimes files
const WHEEL_ROWS_TOP=[0,1,2,3,4,5,6,7]; // roda davantera
const WHEEL_ROWS_BOT=[46,47,48,49,50,51,52,53]; // roda darrere

function drawMoto(dx,dy,lean,wf){
  ctx.save();
  ctx.translate((dx+SDW/2)|0,(dy+SDH)|0);
  if(lean!==0) ctx.transform(1,0,lean*0.055,1,0,0);
  ctx.translate((-SDW/2)|0,-SDH|0);

  // Ombra
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(SDW/2,SDH+3,SDW*0.42,5,0,0,Math.PI*2);
  ctx.fill();

  // Sprite base
  ctx.drawImage(sprOC,0,0);

  // Animació rodes: redibux files de roda amb offset
  const off=(wf%PX+PX)%PX;
  if(off>0){
    [...WHEEL_ROWS_TOP,...WHEEL_ROWS_BOT].forEach(sy=>{
      const row=SPR[sy];
      if(!row)return;
      row.forEach((col,sx)=>{
        if(!col||col===0)return;
        const nx=((sx*PX+off)%(SPR_COLS*PX));
        ctx.fillStyle=col;
        ctx.fillRect(nx,sy*PX,PX,PX);
      });
    });
  }
  ctx.restore();
}

  {x:270,y:7, s:[[1,0],[2,0],[3,0],[0,1],[1,1],[2,1],[3,1],[4,1],[1,2],[2,2],[3,2]]},
  {x:320,y:18,s:[[1,0],[2,0],[3,0],[1,1],[2,1],[3,1],[4,1],[1,2],[2,2],[3,2]]},
];
function drawSky(){
  const rh=HOR/SKY_ROWS.length;
  SKY_ROWS.forEach((c,i)=>px(0,i*rh|0,LW,rh+1|0,c));
  MTNS.forEach((m)=>{ const {pts,c,s,snow}=m;
    ctx.fillStyle=s; ctx.beginPath(); ctx.moveTo(0,HOR);
    pts.forEach(([x,y])=>ctx.lineTo(x,HOR-y));
    ctx.lineTo(LW,HOR); ctx.closePath(); ctx.fill();
    ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(0,HOR-2);
    pts.forEach(([x,y])=>ctx.lineTo(x,HOR-y+2));
    ctx.lineTo(LW,HOR-2); ctx.closePath(); ctx.fill();
    if(m.snow){
      // Neu als cims: degradat de blanc
      ctx.fillStyle='rgba(255,255,255,0.88)';
      pts.filter(([,y])=>y>28).forEach(([x,y])=>{
        // Neu principal
        ctx.beginPath();ctx.moveTo(x,HOR-y+2);ctx.lineTo(x-7,HOR-y+14);ctx.lineTo(x+7,HOR-y+14);ctx.closePath();ctx.fill();
        // Capa neu interior (brillant)
        ctx.fillStyle='rgba(255,255,255,0.55)';
        ctx.beginPath();ctx.moveTo(x,HOR-y+2);ctx.lineTo(x-4,HOR-y+10);ctx.lineTo(x+4,HOR-y+10);ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.88)';
      });
      // Línies de cresta (pixel art)
      ctx.strokeStyle='rgba(255,255,255,0.30)';
      ctx.lineWidth=1;
      for(let i=1;i<pts.length-1;i++){
        const [x,y]=pts[i];
        if(y>18){
          ctx.beginPath();
          ctx.moveTo(x-8,HOR-y+16);ctx.lineTo(x,HOR-y+4);ctx.lineTo(x+8,HOR-y+16);
          ctx.stroke();
        }
      }
    }
  });
  px(0,HOR-3,LW,3,'rgba(200,220,180,0.28)');
  CLOUDS.forEach(cl=>{
    cl.x=(cl.x+0.06)%(LW+20);
    cl.s.forEach(([dx,dy])=>px(cl.x+dx*2,cl.y+dy*2,2,2,'rgba(255,255,255,0.78)'));
  });
}

// ═══════════════════════════════════════════════
//  TERRA  camí de terra pixel art (scanline)
// ═══════════════════════════════════════════════
const DIRT=['#b86830','#c07038','#b06028','#c87840','#aa5e28','#be6a32'];
const TRACK=['#7a4010','#6a3808','#824818','#704010'];
const PEBBLE=['#c8a878','#b89868','#d4b888','#e0c898','#9a7848'];

// Pedres pre-calculades (posicions relatives al camí)
const PEBBLES=Array.from({length:80},(_,i)=>({
  rpos:(i*79+i*i*13)%180,
  ryoff:(i*41+23)%90,
  sz:1+(i%4===0?1:0),
  ci:i%5,
}));

let scrollY=0;
function roadHW(z){return 18+z*155;}

function drawTerrain(){
  const cx=LW/2;
  for(let y=HOR;y<LH;y++){
    const z=(y-HOR)/(LH-HOR);
    const hw=roadHW(z);
    const x0=(cx-hw)|0, x1=(cx+hw)|0;
    const sy=(scrollY+y)|0;

    // Terra lateral (variació de color per fila)
    const di=((sy)%6+6)%6;
    const dc=DIRT[di];
    if(x0>0)  px(0,y,x0,1,dc);
    if(x1<LW) px(x1,y,LW-x1,1,dc);

    // Vorera
    const ew=Math.max(1,(z*2.5)|0);
    px(x0-ew,y,ew,1,'#7a3e0e');
    px(x1,y,ew,1,'#7a3e0e');

    // Camí de terra
    const ti=((sy)%4+4)%4;
    px(x0,y,x1-x0,1,TRACK[ti]);

    // Roderes fosques
    const t1=(cx-hw*0.30)|0, t2=(cx+hw*0.30)|0;
    const tw=Math.max(1,(z*2.2)|0);
    px(t1,y,tw,1,'#5a2c08');
    px(t2,y,tw,1,'#5a2c08');

    // Pedres
    if(z>0.10){
      PEBBLES.forEach(pb=>{
        const pvy=((pb.ryoff+(scrollY|0)*1.1)%(LH-HOR))|0;
        if(pvy!==(y-HOR))return;
        const rw=x1-x0;
        if(rw<2)return;
        const ppx=x0+(pb.rpos%rw)|0;
        px(ppx,y,pb.sz,pb.sz,PEBBLE[pb.ci]);
      });
    }
  }
  scrollY+=G.spd*1.4;
}

// ═══════════════════════════════════════════════
//  VEGETACIÓ lateral
// ═══════════════════════════════════════════════
function mkPine(h){
  const w=(h*0.68)|0, oc=document.createElement('canvas');
  oc.width=w; oc.height=h+4;
  const c=oc.getContext('2d');
  const cols=[['#1e3a10','#2e5218','#3a6028'],['#243e14','#345820','#406630'],['#182e0e','#283e16','#303e20']];
  [[0.92,0.34,0],[0.74,0.30,0.22],[0.56,0.28,0.42]].forEach(([wf,hf,yf],i)=>{
    const lw=(w*wf)|0,lh=(h*hf)|0,ly=(h*0.76-h*yf)|0;
    c.fillStyle=cols[i][0];
    c.beginPath();c.moveTo(w/2,ly-lh);c.lineTo(w/2-lw/2,ly);c.lineTo(w/2+lw/2,ly);c.closePath();c.fill();
    c.fillStyle=cols[i][1];
    c.beginPath();c.moveTo(w/2,ly-lh+1);c.lineTo(w/2-lw/2+2,ly-1);c.lineTo(w/2+lw/2-2,ly-1);c.closePath();c.fill();
    c.fillStyle=cols[i][2];
    c.beginPath();c.moveTo(w/2-lw*0.1,ly-lh+1);c.lineTo(w/2-lw*0.4,ly-lh*0.3);c.lineTo(w/2+lw*0.05,ly-lh*0.35);c.closePath();c.fill();
  });
  c.fillStyle='#5a3010';c.fillRect(w/2-2|0,h*0.76|0,4,h*0.24+4|0);
  return oc;
}
function mkBush(s){
  const oc=document.createElement('canvas');
  oc.width=s;oc.height=s;
  const c=oc.getContext('2d');
  const cols=['#2a4818','#3a5820','#4a6828','#2e4e18','#1e3a10','#506030'];
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){
    const dx=x-s/2,dy=y-s/2;
    if(Math.sqrt(dx*dx+dy*dy)<s*0.45+(Math.sin(x*0.8+y*1.2)*s*0.06)){
      c.fillStyle=cols[(x*3+y*7)%cols.length];c.fillRect(x,y,1,1);
    }
  }
  return oc;
}
const PINE_A=mkPine(44),PINE_B=mkPine(28);
const BUSH_A=mkBush(22),BUSH_B=mkBush(14);

const SIDES=Array.from({length:64},(_,i)=>({
  z:Math.random(),side:i%2?1:-1,
  type:Math.random()<0.52?'pine':'bush',
  off:6+Math.random()*20,big:Math.random()<0.5,
}));
function drawVeg(){
  const cx=LW/2;
  [...SIDES].sort((a,b)=>a.z-b.z).forEach(s=>{
    const sy=HOR+s.z*(LH-HOR);
    const hw=roadHW(s.z);
    const bx=cx+s.side*(hw+s.off*(s.z*0.85+0.2)*2+3);
    const sc=s.z;
    if(sc<0.07)return;
    if(s.type==='pine'){
      const spr=s.big?PINE_A:PINE_B;
      const sw=(spr.width*sc*2.5)|0,sh=(spr.height*sc*2.5)|0;
      if(sw<3)return;
      ctx.drawImage(spr,(bx-sw/2)|0,(sy-sh)|0,sw,sh);
    }else{
      const spr=s.big?BUSH_A:BUSH_B;
      const sw=(spr.width*sc*2.5)|0,sh=(spr.height*sc*2.5)|0;
      if(sw<3)return;
      ctx.drawImage(spr,(bx-sw/2)|0,(sy-sh*0.55)|0,sw,sh);
    }
    s.z+=G.spd*0.0028;
    if(s.z>1.04){s.z=0.01+Math.random()*0.05;s.off=6+Math.random()*20;s.type=Math.random()<0.52?'pine':'bush';s.big=Math.random()<0.5;}
  });
}

// ═══════════════════════════════════════════════
//  HUD pixel art
// ═══════════════════════════════════════════════
function drawHUD(){
  px(0,0,LW,13,'rgba(0,0,0,0.60)');
  for(let i=0;i<3;i++){
    const hc=i<G.hp?'#ff2020':'#300808';
    const hx=4+i*13;
    [[1,0],[2,0],[0,1],[1,1],[2,1],[3,1],[0,2],[1,2],[2,2],[3,2],[1,3],[2,3]].forEach(([dx,dy])=>px(hx+dx,2+dy,1,1,hc));
  }
  ctx.fillStyle='#ffdd44';ctx.font='bold 6px monospace';ctx.textAlign='left';
  ctx.fillText('KM '+(G.dist/80).toFixed(1),46,10);
  ctx.fillStyle='#fff';
  ctx.fillText(Math.round(G.spd*14)+'km/h',130,10);
  ctx.textAlign='right';ctx.fillStyle='#88ddff';
  ctx.fillText(G.score+'pts',LW-3,10);
  // Barra velocitat
  const bx=LW-8,by=17,bh=52;
  px(bx,by,6,bh,'#181818');
  const r=Math.min(1,G.spd/G.maxSpd);
  px(bx,(by+bh*(1-r))|0,6,(bh*r)|0,r>0.82?'#ff4400':r>0.55?'#ffaa00':'#44dd44');
}

// ═══════════════════════════════════════════════
//  PANTALLES
// ═══════════════════════════════════════════════
function drawStart(){
  px(0,0,LW,LH,'rgba(0,0,0,0.75)');
  ctx.textAlign='center';
  ctx.fillStyle='#ff8800';ctx.font='bold 14px monospace';
  ctx.fillText('TRAILRIDER',LW/2,LH*0.35);
  ctx.fillStyle='#ffaa22';ctx.font='bold 10px monospace';
  ctx.fillText('.cat',LW/2,LH*0.35+16);
  ctx.fillStyle='#e8e8e8';ctx.font='7px monospace';
  ctx.fillText('TÉNÈRE XT660Z',LW/2,LH*0.52);
  ctx.fillStyle='rgba(255,255,255,0.48)';ctx.font='6px monospace';
  ctx.fillText('prem GAS per arrencar',LW/2,LH*0.64);
}

// ═══════════════════════════════════════════════
//  ESTAT
// ═══════════════════════════════════════════════
let G={on:false,score:0,dist:0,hp:3,spd:0,maxSpd:3.5,mx:LW/2,tx:LW/2,lean:0,frame:0};

function update(){
  if(!G.on)return;
  G.frame++;
  if(K['ArrowUp']||K[' '])   G.spd=Math.min(G.maxSpd,G.spd+0.07);
  else                        G.spd=Math.max(0,G.spd-0.025);
  if(K['ArrowDown'])          G.spd=Math.max(0,G.spd-0.12);
  const lim=roadHW(1)*0.82-SDW*0.55;
  if(K['ArrowLeft']){G.tx=Math.max(LW/2-lim,G.tx-G.spd*1.5);G.lean=Math.max(-1,G.lean-0.16);}
  else if(K['ArrowRight']){G.tx=Math.min(LW/2+lim,G.tx+G.spd*1.5);G.lean=Math.min(1,G.lean+0.16);}
  else G.lean*=0.82;
  G.mx+=(G.tx-G.mx)*0.16;
  G.dist+=G.spd; G.score+=(G.spd*0.2)|0;
}

function render(){
  ctx.clearRect(0,0,LW,LH);
  drawSky();
  drawTerrain();
  drawVeg();
  const wp=(G.frame/2)|0;
  drawMoto((G.mx-SDW/2)|0,(LH-SDH-6)|0,G.lean,wp);
  drawHUD();
  if(!G.on)drawStart();
}
(function loop(){update();render();requestAnimationFrame(loop);})();
</script>
