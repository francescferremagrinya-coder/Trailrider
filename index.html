<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Trailrider.cat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
#ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10;}
#lc{position:absolute;bottom:14px;left:14px;display:flex;gap:10px;pointer-events:all;}
#rc{position:absolute;bottom:14px;right:14px;display:flex;gap:10px;pointer-events:all;}
.b{width:60px;height:60px;border-radius:12px;background:rgba(0,0,0,0.55);border:2px solid rgba(255,255,255,0.20);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:rgba(255,255,255,0.80);font-size:20px;-webkit-user-select:none;user-select:none;cursor:pointer;}
.b span{font-size:8px;font-weight:700;letter-spacing:1px;font-family:monospace;color:rgba(255,255,255,0.50);}
.b.on{background:rgba(80,80,80,0.90);}
</style>
</head>

<canvas id="c"></canvas>
<div id="gameUI" style="display:none;">
  <div id="lc">
    <div class="b" id="bl">&#9664;</div>
    <div class="b" id="br">&#9654;</div>
  </div>
</div>
<script>
"use strict";
var LW = 480, LH = 270;
var CV = document.getElementById("c");
var ctx = CV.getContext("2d");
CV.width = LW; CV.height = LH;

function resize() {
  var s = Math.min(window.innerWidth / LW, window.innerHeight / LH);
  CV.style.width = (LW*s)+"px"; CV.style.height = (LH*s)+"px";
}
resize();
window.addEventListener("resize", resize);

function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);}

// roundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);
    this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);
    this.quadraticCurveTo(x,y,x+r,y);this.closePath();
  };
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

// Input
var K = {};
document.addEventListener("keydown",function(e){
  K[e.key]=true;
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].indexOf(e.key)>=0)e.preventDefault();
});
document.addEventListener("keyup",function(e){K[e.key]=false;});

function mkB(id,key){
  var el=document.getElementById(id);
  if(!el)return;
  function on(e){e.preventDefault();K[key]=true;el.classList.add("on");}
  function off(e){e.preventDefault();K[key]=false;el.classList.remove("on");}
  el.addEventListener("touchstart",on,{passive:false});
  el.addEventListener("touchend",off,{passive:false});
  el.addEventListener("touchcancel",off,{passive:false});
  el.addEventListener("mousedown",on);
  el.addEventListener("mouseup",off);
  el.addEventListener("mouseleave",off);
}
mkB("bl","ArrowLeft");
mkB("br","ArrowRight");

// MENU
var menuState = "start";
var menuSel   = 0;
var menuFrame = 0;
var BTNS = [
  {label:"START",   act:"start"},
  {label:"OPTIONS", act:"opts"},
  {label:"EXIT",    act:"exit"}
];

CV.addEventListener("click",function(e){
  if(menuState!=="start")return;
  var r=CV.getBoundingClientRect(), s=LW/r.width;
  var cy=(e.clientY-r.top)*s;
  for(var i=0;i<BTNS.length;i++){
    var by=menuBtnY(i);
    if(cy>by-1&&cy<by+20){menuSel=i;if(BTNS[i].act==="start")startGame();}
  }
});
CV.addEventListener("touchend",function(e){
  e.preventDefault();
  if(menuState!=="start")return;
  var r=CV.getBoundingClientRect(), s=LW/r.width;
  var t=e.changedTouches[0];
  var cy=(t.clientY-r.top)*s;
  for(var i=0;i<BTNS.length;i++){
    var by=menuBtnY(i);
    if(cy>by-1&&cy<by+20){menuSel=i;if(BTNS[i].act==="start")startGame();}
  }
},{passive:false});
document.addEventListener("keydown",function(e){
  if(menuState!=="start")return;
  if(e.key==="ArrowDown")menuSel=(menuSel+1)%BTNS.length;
  if(e.key==="ArrowUp")menuSel=(menuSel-1+BTNS.length)%BTNS.length;
  if(e.key===" "||e.key==="Enter"){if(BTNS[menuSel].act==="start")startGame();}
});

function menuBtnY(i){
  // Botons a la part esquerra-centre, com la imatge de referència
  // A 480×270: START≈y142, OPTIONS≈y165, EXIT≈y188
  return 138 + i * 24;
}

function startGame(){
  menuState="game";
  document.getElementById("gameUI").style.display="block";
  G=newGame();
}

function drawMenu(){
  menuFrame++;
  // Fons: la portada
  if(portImg.complete&&portImg.naturalWidth>0){
    ctx.drawImage(portImg,0,0,LW,LH);
  } else {
    px(0,0,LW,LH,"#1a0e08");
  }
  // Botons sobreposats exactament on surten a la imatge
  var bw=156, bh=19, bx=LW/2-bw/2;
  for(var i=0;i<BTNS.length;i++){
    var by=menuBtnY(i);
    var isSel=(i===menuSel);
    var isStart=(BTNS[i].act==="start");
    // Ombra
    ctx.fillStyle="rgba(0,0,0,0.65)";
    rr(bx+2,by+2,bw,bh,5);ctx.fill();
    // Fons botó
    ctx.fillStyle=isStart?(isSel?"#e86010":"#c85008"):(isSel?"rgba(55,35,15,0.92)":"rgba(8,6,4,0.85)");
    rr(bx,by,bw,bh,5);ctx.fill();
    // Vora
    ctx.strokeStyle=isStart?(isSel?"#ff9040":"#ff6820"):(isSel?"#886644":"#443322");
    ctx.lineWidth=1.5;
    rr(bx,by,bw,bh,5);ctx.stroke();
    // Highlight
    ctx.fillStyle="rgba(255,255,255,0.08)";
    rr(bx+2,by+1,bw-4,bh*0.45,3);ctx.fill();
    // Text
    ctx.font="bold "+(isStart?"9":"8")+"px monospace";
    ctx.textAlign="center";
    ctx.fillStyle="rgba(0,0,0,0.55)";
    ctx.fillText(BTNS[i].label,LW/2+1,by+bh*0.70+1);
    ctx.fillStyle=isStart?"#fff":(isSel?"#ccc":"#999");
    ctx.fillText(BTNS[i].label,LW/2,by+bh*0.70);
  }
  // Parpelleig
  if(Math.floor(menuFrame/30)%2===0){
    ctx.font="5px monospace";ctx.textAlign="center";
    ctx.fillStyle="rgba(255,210,140,0.72)";
    ctx.fillText("TAP START o ESPAI",LW/2,LH-7);
  }
}

// Sprite render — PX=2 (moto més petita)
var PX  = 2;
var SDW = SPR_COLS * PX;
var SDH = SPR_ROWS * PX;

function buildSprCanvas(){
  var oc=document.createElement("canvas");
  oc.width=SDW; oc.height=SDH;
  var c2=oc.getContext("2d");
  for(var sy=0;sy<SPR.length;sy++){
    var row=SPR[sy];
    for(var sx=0;sx<row.length;sx++){
      var col=row[sx];
      if(!col||col===0)continue;
      c2.fillStyle=col;
      c2.fillRect(sx*PX,sy*PX,PX,PX);
    }
  }
  return oc;
}
var sprOC=buildSprCanvas();
var WT=[0,1,2,3,4,5,6,7], WB=[46,47,48,49,50,51,52,53];

function drawMoto(dx,dy,lean,wf){
  ctx.save();
  ctx.translate((dx+SDW/2)|0,(dy+SDH)|0);
  if(lean!==0)ctx.transform(1,0,lean*0.05,1,0,0);
  ctx.translate((-SDW/2)|0,-SDH|0);
  ctx.fillStyle="rgba(0,0,0,0.25)";
  ctx.beginPath();ctx.ellipse(SDW/2,SDH+2,SDW*0.42,3,0,0,Math.PI*2);ctx.fill();
  ctx.drawImage(sprOC,0,0);
  var off=(wf%PX+PX)%PX;
  if(off>0){
    var wrows=WT.concat(WB);
    for(var wi=0;wi<wrows.length;wi++){
      var row2=SPR[wrows[wi]];
      if(!row2)continue;
      for(var sx2=0;sx2<row2.length;sx2++){
        var col2=row2[sx2];
        if(!col2||col2===0)continue;
        ctx.fillStyle=col2;
        ctx.fillRect((sx2*PX+off)%(SPR_COLS*PX),wrows[wi]*PX,PX,PX);
      }
    }
  }
  ctx.restore();
}

// CORBES: la carretera es desplaça lateralment suaument
// roadCX = centre actual de la carretera (canvia amb les curves)
var roadCX    = LW/2;  // centre actual
var roadTarget= LW/2;  // target (on va)
var curveDur  = 0;     // frames que falta per canviar corba
var curveDir  = 0;     // -1 esquerra, 0 recte, +1 dreta
var curveSpeed= 0;     // px per frame que es desplaça roadCX

function updateCurve(){
  curveDur--;
  if(curveDur<=0){
    // Nova corba: 40% recta, 30% esquerra, 30% dreta
    var r=Math.random();
    if(r<0.40){ curveDir=0; curveSpeed=0; curveDur=80+Math.random()*60; }
    else if(r<0.70){ curveDir=-1; curveSpeed=0.6+Math.random()*0.8; curveDur=60+Math.random()*80; }
    else { curveDir=1;  curveSpeed=0.6+Math.random()*0.8; curveDur=60+Math.random()*80; }
  }
  // Desplaça el centre de la carretera
  roadCX += curveDir * curveSpeed * (G.spd/G.maxSpd);
  // Límits: no surtis de pantalla
  roadCX = Math.max(LW*0.28, Math.min(LW*0.72, roadCX));
  // La moto segueix la carretera una mica (drift suau)
  G.tx += (roadCX - LW/2) * 0.015;
}

function roadHW(z){ return 14+z*118; }

// Terra
var DIRT  =["#b86830","#c07038","#b06028","#c87840","#aa5e28","#be6a32"];
var TRACK =["#7a4010","#6a3808","#824818","#704010"];
var PEBBLE=["#c8a878","#b89868","#d4b888","#e0c898","#9a7848"];
var PEBBLES=[];
for(var pi=0;pi<80;pi++) PEBBLES.push({rpos:(pi*79+pi*pi*13)%180,ryoff:(pi*41+23)%60,sz:1+(pi%4===0?1:0),ci:pi%5});
var scrollY=0;

function drawTerrain(){
  for(var y=HOR;y<LH;y++){
    var z=(y-HOR)/(LH-HOR);
    var hw=roadHW(z);
    // El centre de la carretera es desplaça amb la corba
    // A l'horitzó (z=0) roadCX=roadCX, a la base (z=1) segueix la moto
    var cxAtZ = roadCX*(1-z) + (LW/2)*z;
    var x0=(cxAtZ-hw)|0, x1=(cxAtZ+hw)|0;
    var sy2=(scrollY+y)|0;
    var di=((sy2)%6+6)%6;
    if(x0>0)  px(0,y,x0,1,DIRT[di]);
    if(x1<LW) px(x1,y,LW-x1,1,DIRT[di]);
    var ew=Math.max(1,(z*2.5)|0);
    px(x0-ew,y,ew,1,"#7a3e0e"); px(x1,y,ew,1,"#7a3e0e");
    var ti=((sy2)%4+4)%4;
    px(x0,y,x1-x0,1,TRACK[ti]);
    var t1=(cxAtZ-hw*0.30)|0, t2=(cxAtZ+hw*0.30)|0;
    var tw=Math.max(1,(z*2.2)|0);
    px(t1,y,tw,1,"#5a2c08"); px(t2,y,tw,1,"#5a2c08");
    if(z>0.10){
      for(var pbi=0;pbi<PEBBLES.length;pbi++){
        var pb=PEBBLES[pbi];
        var pvy=((pb.ryoff+(scrollY|0)*1.1)%(LH-HOR))|0;
        if(pvy!==(y-HOR))continue;
        var rw=x1-x0; if(rw<2)continue;
        px(x0+(pb.rpos%rw)|0,y,pb.sz,pb.sz,PEBBLE[pb.ci]);
      }
    }
  }
  scrollY+=G.spd*1.2;
}

// Vegetació lateral
function mkPine(h){
  var w=(h*0.68)|0, oc=document.createElement("canvas");
  oc.width=w; oc.height=h+4;
  var c=oc.getContext("2d");
  var layers=[[0.92,0.34,0,"#1e3a10","#2e5218","#3a6028"],[0.74,0.30,0.22,"#243e14","#345820","#406630"],[0.56,0.28,0.42,"#182e0e","#283e16","#303e20"]];
  for(var li=0;li<layers.length;li++){
    var l=layers[li];
    var lw=(w*l[0])|0,lh=(h*l[1])|0,ly=(h*0.76-h*l[2])|0;
    c.fillStyle=l[3];c.beginPath();c.moveTo(w/2,ly-lh);c.lineTo(w/2-lw/2,ly);c.lineTo(w/2+lw/2,ly);c.closePath();c.fill();
    c.fillStyle=l[4];c.beginPath();c.moveTo(w/2,ly-lh+1);c.lineTo(w/2-lw/2+2,ly-1);c.lineTo(w/2+lw/2-2,ly-1);c.closePath();c.fill();
    c.fillStyle=l[5];c.beginPath();c.moveTo(w/2-lw*0.1,ly-lh+1);c.lineTo(w/2-lw*0.4,ly-lh*0.3);c.lineTo(w/2+lw*0.05,ly-lh*0.35);c.closePath();c.fill();
  }
  c.fillStyle="#5a3010";c.fillRect((w/2-2)|0,(h*0.76)|0,4,(h*0.24+4)|0);
  return oc;
}
function mkBush(s){
  var oc=document.createElement("canvas");oc.width=s;oc.height=s;
  var c=oc.getContext("2d");
  var cols=["#2a4818","#3a5820","#4a6828","#2e4e18","#1e3a10","#506030"];
  for(var y=0;y<s;y++) for(var x=0;x<s;x++){
    var dx=x-s/2,dy=y-s/2;
    if(Math.sqrt(dx*dx+dy*dy)<s*0.45+Math.sin(x*0.8+y*1.2)*s*0.06){c.fillStyle=cols[(x*3+y*7)%cols.length];c.fillRect(x,y,1,1);}
  }
  return oc;
}

for(var si=0;si<64;si++) SIDES.push({z:Math.random(),side:si%2?1:-1,type:Math.random()<0.52?"pine":"bush",off:6+Math.random()*20,big:Math.random()<0.5});

function drawVeg(){
  var sorted=SIDES.slice().sort(function(a,b){return a.z-b.z;});
  for(var si2=0;si2<sorted.length;si2++){
    var s=sorted[si2];
    var sy3=HOR+s.z*(LH-HOR);
    var hw2=roadHW(s.z);
    var cxZ=roadCX*(1-s.z)+(LW/2)*s.z;
    var bx=cxZ+s.side*(hw2+s.off*(s.z*0.85+0.2)*2+3);
    if(s.z<0.07)continue;
    var spr=s.type==="pine"?(s.big?PINE_A:PINE_B):(s.big?BUSH_A:BUSH_B);
    var sw=(spr.width*s.z*2.5)|0,sh=(spr.height*s.z*2.5)|0;
    if(sw<3)continue;
    ctx.drawImage(spr,(bx-sw/2)|0,(sy3-(s.type==="pine"?sh:sh*0.55))|0,sw,sh);
    s.z+=G.spd*0.0025;
    if(s.z>1.04){s.z=0.01+Math.random()*0.05;s.off=6+Math.random()*20;s.type=Math.random()<0.52?"pine":"bush";s.big=Math.random()<0.5;}
  }
}

// OBSTACLES
// Projecció expo: la z creix exponencialment perquè sembli que s'apropen ràpid
// z_visual = z^0.5 → accelera la projecció visual
function projZ(z){ return Math.sqrt(z); }  // z[0..1] → visual[0..1] accelerat

function mkGrass(){
  var oc=document.createElement("canvas");oc.width=22;oc.height=18;
  var c=oc.getContext("2d");
  var gc=["#4a7820","#3a6018","#5a8828","#2e5010","#6a9030"];
  for(var gi=0;gi<9;gi++){
    var gx=2+gi*2,gh=6+Math.sin(gi*1.4)*5;
    c.strokeStyle=gc[gi%gc.length];c.lineWidth=1;
    c.beginPath();c.moveTo(gx,18);c.quadraticCurveTo(gx+(gi%3-1)*3,18-gh*0.5,gx+(gi%2===0?1:-1)*2,18-gh);c.stroke();
  }
  return oc;
}
function mkRBush(s){
  var oc=document.createElement("canvas");oc.width=s;oc.height=(s*0.72)|0;
  var c=oc.getContext("2d");
  var h=oc.height;
  var cols=["#4a7020","#3a5818","#5a8028","#2a4810","#608030","#486820"];
  for(var y=0;y<h;y++) for(var x=0;x<s;x++){
    var dx=x-s/2,dy=y-h*0.45;
    if(Math.sqrt(dx*dx+(dy*1.35)*(dy*1.35))<s*0.44+Math.sin(x*1.1+y*0.9)*s*0.09){c.fillStyle=cols[(x*2+y*5)%cols.length];c.fillRect(x,y,1,1);}
  }
  return oc;
}
var GRASS_SPR=mkGrass(),RBUSH_S=mkRBush(20),RBUSH_M=mkRBush(30),RBUSH_L=mkRBush(42);

var obstacles=[], obsTimer=0, splashes=[];
var dust=[];

function addDust(x,y,spd,crashed){
  // 2-3 partícules per frame
  var count = crashed ? 4 : 2;
  for(var i=0;i<count;i++){
    var ang = Math.PI + (Math.random()-0.5)*0.8;  // cap enrere i als costats
    var v   = (0.5 + Math.random()*1.2) * (crashed?2:1);
    dust.push({
      x: x + (Math.random()-0.5)*SDW*0.5,
      y: y + SDH*0.4,
      vx: Math.cos(ang)*v,
      vy: Math.sin(ang)*v - 0.2,
      life: 1,
      sz: 1.5 + Math.random()*(crashed?4:2.5),
      col: crashed ? "rgba(200,100,40," : "rgba(160,110,60,"
    });
  }
}

function tickDust(){
  var alive=[];
  for(var i=0;i<dust.length;i++){
    var d=dust[i];
    d.x+=d.vx; d.y+=d.vy; d.vy+=0.04;
    d.life-=0.06; d.sz=Math.max(0.3,d.sz-0.04);
    if(d.life>0) alive.push(d);
  }
  dust=alive;
}

function drawDust(){
  for(var i=0;i<dust.length;i++){
    var d=dust[i], a=d.life*0.55;
    ctx.fillStyle=d.col+a+")";
    ctx.beginPath();
    ctx.ellipse(d.x,d.y,d.sz*1.6,d.sz*0.7,0,0,Math.PI*2);
    ctx.fill();
  }
}

function addSplash(x,y,spd){
  var s2=spd||2;
  for(var i=0;i<28;i++){
    var a=Math.random()*Math.PI*2, v=2.5+Math.random()*(3.5+s2*1.5);
    splashes.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(2+Math.random()*2),life:1,sz:3+Math.random()*5,tp:"water"});
  }
  for(var j=0;j<7;j++)
    splashes.push({x:x+(Math.random()-0.5)*16,y:y,vx:(Math.random()-0.5)*1.5,vy:-(3+Math.random()*4.5),life:1,sz:4+Math.random()*5,tp:"drop"});
}
function tickSplashes(){
  var a2=[];
  for(var i=0;i<splashes.length;i++){
    var s=splashes[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.20;
    s.life-=s.tp==="drop"?0.032:0.042;
    s.sz=Math.max(0.5,s.sz-0.05);
    if(s.life>0)a2.push(s);
  }
  splashes=a2;
}
function drawSplashes(){
  for(var i=0;i<splashes.length;i++){
    var s=splashes[i], a=Math.min(1,s.life*1.2);
    if(s.tp==="drop"){
      ctx.fillStyle="rgba(130,180,220,"+(a*0.92)+")";
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(s.vy,s.vx)+Math.PI/2);
      ctx.beginPath();ctx.ellipse(0,0,s.sz*0.38,s.sz*0.85,0,0,Math.PI*2);ctx.fill();ctx.restore();
    } else {
      ctx.fillStyle="rgba(100,155,195,"+(a*0.78)+")";
      ctx.beginPath();ctx.ellipse(s.x,s.y,s.sz,s.sz*0.45,0,0,Math.PI*2);ctx.fill();
    }
  }
}

function spawnObs(){
  var types=["hole","puddle","puddle","grass","grass","bush","bush","bush"];
  var t=types[Math.floor(Math.random()*types.length)];
  var los=[-0.62,-0.22,0.22,0.62];
  var lo=los[Math.floor(Math.random()*4)];
  obstacles.push({type:t,lo:lo,z:0.005,hit:false,
    w:t==="hole"?0.12+Math.random()*0.08:t==="puddle"?0.20+Math.random()*0.12:0.10+Math.random()*0.06,
    h:t==="hole"?0.07+Math.random()*0.04:t==="puddle"?0.06+Math.random()*0.04:0.08,
    bv:Math.floor(Math.random()*3)});
}

function drawOneObs(o){
  var pz = projZ(o.z);           // z visual accelerat
  var hw = roadHW(pz);
  var cxZ= roadCX*(1-pz)+(LW/2)*pz;
  var ox = cxZ + o.lo * hw;
  var oy = HOR + pz*(LH-HOR);
  var ow = o.w*hw*2, oh=Math.max(3,o.h*hw*0.65);
  if(oy<HOR||oy>LH+20)return;

  if(o.type==="hole"){
    ctx.fillStyle="rgba(0,0,0,0.50)";
    ctx.beginPath();ctx.ellipse(ox+2,oy+2,ow*0.54,oh*0.66,0,0,Math.PI*2);ctx.fill();
    var hg=ctx.createRadialGradient(ox,oy-oh*0.15,0,ox,oy,ow*0.52);
    hg.addColorStop(0,"#050200");hg.addColorStop(0.55,"#180c04");hg.addColorStop(1,"rgba(35,15,5,0)");
    ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(ox,oy,ow*0.52,oh*0.62,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="#9a6020";ctx.lineWidth=Math.max(1,pz*3);
    ctx.beginPath();ctx.ellipse(ox,oy,ow*0.52,oh*0.62,0,0,Math.PI*2);ctx.stroke();
  } else if(o.type==="puddle"){
    var pr=ow*0.56,ph=oh*0.62;
    ctx.fillStyle="rgba(0,0,0,0.22)";ctx.beginPath();ctx.ellipse(ox+2,oy+3,pr*1.04,ph*0.78,0,0,Math.PI*2);ctx.fill();
    var pg=ctx.createRadialGradient(ox-pr*0.18,oy-ph*0.12,0,ox,oy,pr);
    pg.addColorStop(0,"#88aabf");pg.addColorStop(0.30,"#6a8fa8");pg.addColorStop(0.65,"#4a7090");pg.addColorStop(1,"rgba(30,55,70,0)");
    ctx.fillStyle=pg;ctx.beginPath();ctx.ellipse(ox,oy,pr,ph,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(200,225,242,0.62)";ctx.beginPath();ctx.ellipse(ox-pr*0.20,oy-ph*0.22,pr*0.22,ph*0.14,-0.4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle="rgba(80,120,150,0.40)";ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(ox,oy,pr*0.55,ph*0.55,0,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.ellipse(ox,oy,pr*0.82,ph*0.82,0,0,Math.PI*2);ctx.stroke();
  } else if(o.type==="grass"){
    var sc=pz*2.4,gw=(GRASS_SPR.width*sc)|0,ghh=(GRASS_SPR.height*sc)|0;
    if(gw<3)return;
    ctx.drawImage(GRASS_SPR,(ox-gw/2)|0,(oy-ghh)|0,gw,ghh);
  } else if(o.type==="bush"){
    var bsprs=[RBUSH_S,RBUSH_M,RBUSH_L],bspr=bsprs[Math.min(2,o.bv)];
    var bsc=pz*2.6,bw2=(bspr.width*bsc)|0,bh2=(bspr.height*bsc)|0;
    if(bw2<3)return;
    ctx.fillStyle="rgba(0,0,0,0.22)";ctx.beginPath();ctx.ellipse(ox,oy,bw2*0.44,bh2*0.18,0,0,Math.PI*2);ctx.fill();
    ctx.drawImage(bspr,(ox-bw2/2)|0,(oy-bh2)|0,bw2,bh2);
  }
}

function tickObs(){
  obsTimer++;
  // Spawn cada 50-90 frames (menys quan vas ràpid)
  if(obsTimer>Math.max(35,90-G.spd*8)){obsTimer=0;spawnObs();}
  // Avança z — velocitat constant i lineal (la projecció expo fa la feina visual)
  var alive=[];
  for(var i=0;i<obstacles.length;i++){
    var o=obstacles[i];
    o.z+=0.007*G.spd/G.maxSpd*G.maxSpd;  // constant, no depèn de z
    if(o.z<1.05)alive.push(o);
  }
  obstacles=alive;
  // Col·lisions (comprovem a z_visual > 0.88)
  var mx=G.mx, my=LH-SDH*0.5-4;
  for(var j=0;j<obstacles.length;j++){
    var ob=obstacles[j];
    if(ob.hit)continue;
    var pz2=projZ(ob.z);
    if(pz2<0.82)continue;
    var hw3=roadHW(pz2);
    var cxZ2=roadCX*(1-pz2)+(LW/2)*pz2;
    var ox2=cxZ2+ob.lo*hw3;
    var oy2=HOR+pz2*(LH-HOR);
    var ow2=ob.w*hw3*2*(ob.type==="puddle"?0.52:0.44);
    var oh2=Math.max(3,ob.h*hw3*0.65)*0.50;
    if(Math.abs(mx-ox2)<ow2+SDW*0.26&&Math.abs(my-oy2)<oh2+SDH*0.16){
      ob.hit=true;
      if(ob.type==="puddle"){addSplash(mx,my-SDH*0.1,G.spd);G.spd=Math.max(G.minSpd,G.spd*0.70);}
      else if(ob.type==="hole"){G.hp=Math.max(0,G.hp-1);G.spd=Math.max(0,G.spd-1.0);G.shake=10;G.crashed=true;G.ct=28;if(G.hp<=0)G.over=true;}
      else{G.spd=Math.max(G.minSpd,G.spd*0.85);G.shake=3;}
    }
  }
  tickSplashes();
}

// HUD
function drawHUD(){
  px(0,0,LW,11,"rgba(0,0,0,0.62)");
  for(var i=0;i<3;i++){
    var hc=i<G.hp?"#ff2020":"#300808", hx=4+i*12;
    var hpts=[[1,0],[2,0],[0,1],[1,1],[2,1],[3,1],[0,2],[1,2],[2,2],[3,2],[1,3],[2,3]];
    for(var hi=0;hi<hpts.length;hi++) px(hx+hpts[hi][0],1+hpts[hi][1],1,1,hc);
  }
  ctx.fillStyle="#ffdd44";ctx.font="bold 6px monospace";ctx.textAlign="left";
  ctx.fillText("KM "+(G.dist/80).toFixed(1),42,9);
  ctx.fillStyle="#fff";ctx.fillText(Math.round(G.spd*14)+"km/h",110,9);
  ctx.textAlign="right";ctx.fillStyle="#88ddff";ctx.fillText(G.score+"pts",LW-3,9);
  // Velocímetre
  px(LW-7,14,5,42,"#181818");
  var r=Math.min(1,G.spd/G.maxSpd);
  px(LW-7,(14+42*(1-r))|0,5,(42*r)|0,r>0.85?"#ff4400":r>0.60?"#ffaa00":"#44dd44");
  // Indicador corba
  if(Math.abs(curveDir)>0){
    ctx.fillStyle="rgba(255,220,100,0.80)";ctx.font="7px monospace";ctx.textAlign="center";
    ctx.fillText(curveDir<0?"< CORBA":"CORBA >",LW/2,9);
  }
  // Warning obstacle
  var w0=null;
  for(var wi=0;wi<obstacles.length;wi++){var ob2=obstacles[wi];if(!ob2.hit&&projZ(ob2.z)>0.55&&projZ(ob2.z)<0.80){w0=ob2;break;}}
  if(w0){
    var wc=w0.type==="hole"?"#ff4400":w0.type==="puddle"?"#44aaff":"#44cc44";
    var wt=w0.type==="hole"?"! FORAT":w0.type==="puddle"?"~ TOLL":"* MATOLL";
    ctx.fillStyle=wc;ctx.font="bold 6px monospace";ctx.textAlign="left";
    ctx.fillText(wt,42,9);
  }
}
function drawOver(){
  px(0,0,LW,LH,"rgba(0,0,0,0.78)");
  ctx.textAlign="center";
  ctx.fillStyle="#ff3300";ctx.font="bold 10px monospace";ctx.fillText("GAME OVER",LW/2,LH*0.38);
  ctx.fillStyle="#fff";ctx.font="7px monospace";ctx.fillText(G.score+"pts  "+(G.dist/80).toFixed(1)+"km",LW/2,LH*0.52);
  ctx.fillStyle="rgba(255,255,255,0.45)";ctx.font="6px monospace";ctx.fillText("refresca per tornar",LW/2,LH*0.65);
}

// ESTAT
var G={on:false,over:false,score:0,dist:0,hp:3,spd:0,minSpd:1.5,maxSpd:4.5,mx:LW/2,tx:LW/2,lean:0,frame:0,shake:0,crashed:false,ct:0};
function newGame(){
  obstacles=[];splashes=[];dust=[];scrollY=0;obsTimer=0;roadCX=LW/2;curveDur=0;
  return {on:true,over:false,score:0,dist:0,hp:3,spd:1.5,minSpd:1.5,maxSpd:4.5,mx:LW/2,tx:LW/2,lean:0,frame:0,shake:0,crashed:false,ct:0};
}

function update(){
  if(menuState!=="game"||!G.on||G.over)return;
  G.frame++;
  if(G.crashed){G.ct--;if(G.ct<=0)G.crashed=false;return;}

  // ACCELERACIÓ AUTOMÀTICA — la moto sempre avança, el jugador esquiva
  // La velocitat augmenta gradualment fins a maxSpd
  G.spd=Math.min(G.maxSpd, G.spd+0.004);
  // El jugador pot frenar lleugerament
  if(K["ArrowDown"]) G.spd=Math.max(G.minSpd, G.spd-0.08);

  // Moviment lateral — l'únic control real del jugador
  var lim=roadHW(1)*0.80-SDW*0.55;
  if(K["ArrowLeft"]) {G.tx=Math.max(LW/2-lim,G.tx-G.spd*1.8);G.lean=Math.max(-1,G.lean-0.18);}
  else if(K["ArrowRight"]){G.tx=Math.min(LW/2+lim,G.tx+G.spd*1.8);G.lean=Math.min(1,G.lean+0.18);}
  else G.lean*=0.80;

  updateCurve();
  G.mx+=(G.tx-G.mx)*0.18;
  G.dist+=G.spd;
  G.score+=(G.spd*0.3)|0;
  G.shake=Math.max(0,G.shake-0.5);
  // Pols contínua de la roda — sempre activa quan la moto es mou
  if(G.spd > 0.3){
    addDust(G.mx, LH-SDH-4, G.spd, G.crashed);
  }
  tickDust();
  tickObs();
}

function render(){
  if(menuState==="start"){drawMenu();return;}
  ctx.clearRect(0,0,LW,LH);
  drawSky();drawTerrain();
  obstacles.sort(function(a,b){return a.z-b.z;});
  for(var i=0;i<obstacles.length;i++) drawOneObs(obstacles[i]);
  drawSplashes();drawVeg();
  var sx=G.crashed?Math.sin(G.frame*0.6)*G.shake:0;
  drawMoto((G.mx-SDW/2+sx)|0,(LH-SDH-4)|0,G.lean,(G.frame/2)|0);
  if(G.crashed&&G.ct>10){ctx.fillStyle="rgba(255,30,0,"+(0.38*G.ct/28)+")";ctx.fillRect(0,0,LW,LH);}
  drawHUD();
  if(G.over)drawOver();
}
(function loop(){update();render();requestAnimationFrame(loop);})();
</script></body></html>
